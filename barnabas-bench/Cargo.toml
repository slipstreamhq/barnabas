[package]
name = "barnabas-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
barnabas-core   = { path = "../barnabas-core" }
barnabas-client = { path = "../barnabas-client" }
barnabas-tokio  = { path = "../barnabas-tokio" }
barnabas-glommio = { path = "../barnabas-glommio" }
kafka-protocol = { workspace = true }
bytes          = { workspace = true }
tokio          = { version = "1", features = ["full"] }
glommio        = { git = "https://github.com/dahankzter/glommio", rev = "2acb59d1" }
# The comparison everyone will ask for, available only while librdkafka is
# still something we build against.
rdkafka        = { version = "0.39", default-features = false, features = ["libz", "zstd", "tokio"] }
rskafka = { version = "0.6.0", default-features = false, features = ["unstable-fuzzing"] }
chrono = { version = "0.4.45", default-features = false }
crc32c = "0.6.8"
