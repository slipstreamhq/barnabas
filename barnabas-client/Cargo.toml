[package]
name = "barnabas-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The runtime-agnostic barnabas Kafka client: consumer groups, transactions, admin. Generic over a four-function transport."
readme = "../README.md"
keywords = ["kafka", "client", "producer", "consumer", "transactions"]
categories = ["network-programming", "asynchronous"]

[dev-dependencies]
# The simulator speaks the real wire protocol, so it needs the codec and
# nothing else — no runtime, no sockets.
futures-lite = "2"

[dependencies]
barnabas-core = { path = "../barnabas-core", version = "0.2.0" }
kafka-protocol = { workspace = true }
bytes          = { workspace = true }
thiserror      = { workspace = true }
# SASL/SCRAM. Pure Rust, no C, and small: HMAC and the two SHA-2 sizes Kafka's
# SCRAM mechanisms name.
hmac           = "0.12"
sha2           = "0.10"
