# The native Kafka client. Its own workspace, deliberately: nothing here names
# a Slipstream type, and the whole argument for building it is that it is
# useful outside this repo. See
# `docs/superpowers/specs/2026-08-15-native-kafka-client-design.md`.
[workspace]
resolver = "2"
members = ["barnabas-core", "barnabas-client", "barnabas-glommio", "barnabas-tokio", "barnabas-bench"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kafka-protocol = "0.17"
bytes = "1"
thiserror = "2"
