[package]
name = "barnabas-glommio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The glommio binding for the barnabas Kafka client — thread-per-core, io_uring, no Send required."
readme = "../README.md"
keywords = ["kafka", "glommio", "io-uring", "thread-per-core"]
categories = ["network-programming", "asynchronous"]

[features]
# TLS is opt-in: it pulls rustls and a certificate store, which a client on a
# trusted network has no reason to compile.
tls = ["dep:futures-rustls", "dep:rustls", "dep:webpki-roots"]

[dependencies]
barnabas-core = { path = "../barnabas-core", version = "0.2.0" }
barnabas-client = { path = "../barnabas-client", version = "0.2.0" }
kafka-protocol = { workspace = true }
bytes          = { workspace = true }
thiserror      = { workspace = true }
futures-lite   = "2"
glommio        = { package = "glommio-ng", version = "0.11.1" }
futures-rustls = { version = "0.26", optional = true }
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots   = { version = "0.26", optional = true }
