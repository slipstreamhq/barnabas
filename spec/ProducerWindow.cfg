\* Five in flight is what Kafka allows with idempotence enabled, and what
\* DEFAULT_MAX_IN_FLIGHT uses. Eight batches and three failures is enough for
\* a failure to land at the start, the middle and the end of a window, with
\* windows still pending behind it.
CONSTANTS
    Batches = 8
    MaxInFlight = 5
    MaxFailures = 3

\* `SPECIFICATION` rather than INIT/NEXT: the liveness property needs the
\* fairness condition, which only `Spec` carries.
SPECIFICATION Spec

INVARIANT LogIsExactPrefix
PROPERTY AllEventuallyWritten
